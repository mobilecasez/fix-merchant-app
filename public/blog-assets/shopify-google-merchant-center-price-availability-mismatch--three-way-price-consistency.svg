<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640"><title>Three-way price consistency: feed, visible page price, and structured data must all agree</title>
<defs>
<linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="1" stop-color="#0d1a30"/></linearGradient>
<radialGradient id="okGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#38d39a" stop-opacity="0.16"/><stop offset="1" stop-color="#38d39a" stop-opacity="0"/></radialGradient>
<radialGradient id="badGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ef6f6f" stop-opacity="0.16"/><stop offset="1" stop-color="#ef6f6f" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="640" rx="18" fill="url(#fbg)" stroke="#25395a" stroke-width="1"/>

<text x="60" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30" font-weight="800" fill="#e9f0fa">All three sources must agree — including currency</text>
<text x="60" y="100" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#9fb2c9">Google compares the feed against the visible price and the structured data on your landing page.</text>

<!-- ===== LEFT: ALL MATCH = APPROVED ===== -->
<g transform="translate(60,150)">
<circle cx="260" cy="180" r="230" fill="url(#okGlow)"/>
<rect x="0" y="0" width="520" height="430" rx="16" fill="#0e1c34" stroke="#25395a" stroke-width="1.5"/>
<rect x="20" y="20" width="180" height="40" rx="12" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/>
<text x="40" y="46" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#38d39a">ALL MATCH</text>

<!-- source boxes -->
<g transform="translate(28,86)">
<rect x="0" y="0" width="464" height="64" rx="12" fill="#0a1526" stroke="#25395a" stroke-width="1.5"/>
<text x="22" y="30" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#9fb2c9">Feed [price]</text>
<text x="22" y="52" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6b819c">Google &amp; YouTube app</text>
<text x="442" y="42" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#38d39a">USD 24.00</text>
</g>
<g transform="translate(28,162)">
<rect x="0" y="0" width="464" height="64" rx="12" fill="#0a1526" stroke="#25395a" stroke-width="1.5"/>
<text x="22" y="30" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#9fb2c9">Visible price</text>
<text x="22" y="52" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6b819c">What the shopper sees</text>
<text x="442" y="42" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#38d39a">USD 24.00</text>
</g>
<g transform="translate(28,238)">
<rect x="0" y="0" width="464" height="64" rx="12" fill="#0a1526" stroke="#25395a" stroke-width="1.5"/>
<text x="22" y="30" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#9fb2c9">Structured data</text>
<text x="22" y="52" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6b819c">JSON-LD on the page</text>
<text x="442" y="42" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#38d39a">USD 24.00</text>
</g>

<!-- approved result -->
<g transform="translate(28,328)">
<rect x="0" y="0" width="464" height="76" rx="12" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/>
<circle cx="48" cy="38" r="20" fill="none" stroke="#38d39a" stroke-width="2.5"/>
<path d="M39 38 L46 46 L59 30" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="34" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="800" fill="#38d39a">Approved</text>
<text x="86" y="58" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#9fb2c9">Item is eligible to show</text>
</g>
</g>

<!-- ===== RIGHT: ONE DIFFERS = DISAPPROVED ===== -->
<g transform="translate(620,150)">
<circle cx="260" cy="180" r="230" fill="url(#badGlow)"/>
<rect x="0" y="0" width="520" height="430" rx="16" fill="#0e1c34" stroke="#25395a" stroke-width="1.5"/>
<rect x="20" y="20" width="190" height="40" rx="12" fill="#0a1526" stroke="#ef6f6f" stroke-width="1.5"/>
<text x="40" y="46" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#ef6f6f">ONE DIFFERS</text>

<g transform="translate(28,86)">
<rect x="0" y="0" width="464" height="64" rx="12" fill="#0a1526" stroke="#25395a" stroke-width="1.5"/>
<text x="22" y="30" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#9fb2c9">Feed [price]</text>
<text x="22" y="52" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6b819c">Google &amp; YouTube app</text>
<text x="442" y="42" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#e9f0fa">USD 24.00</text>
</g>
<g transform="translate(28,162)">
<rect x="0" y="0" width="464" height="64" rx="12" fill="#0a1526" stroke="#ef6f6f" stroke-width="1.5"/>
<text x="22" y="30" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e9f0fa">Visible price</text>
<text x="22" y="52" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6b819c">Crawled landing page</text>
<text x="442" y="42" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#ef6f6f">USD 19.50</text>
</g>
<g transform="translate(28,238)">
<rect x="0" y="0" width="464" height="64" rx="12" fill="#0a1526" stroke="#25395a" stroke-width="1.5"/>
<text x="22" y="30" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#9fb2c9">Structured data</text>
<text x="22" y="52" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6b819c">JSON-LD on the page</text>
<text x="442" y="42" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#e9f0fa">USD 24.00</text>
</g>

<!-- disapproved result -->
<g transform="translate(28,328)">
<rect x="0" y="0" width="464" height="76" rx="12" fill="#0a1526" stroke="#ef6f6f" stroke-width="1.5"/>
<circle cx="48" cy="38" r="20" fill="none" stroke="#ef6f6f" stroke-width="2.5"/>
<line x1="41" y1="31" x2="55" y2="45" stroke="#ef6f6f" stroke-width="3" stroke-linecap="round"/>
<line x1="55" y1="31" x2="41" y2="45" stroke="#ef6f6f" stroke-width="3" stroke-linecap="round"/>
<text x="86" y="34" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="800" fill="#ef6f6f">Disapproved</text>
<text x="86" y="58" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#9fb2c9">Mismatched value (page crawl) [price]</text>
</g>
</g>
</svg>
