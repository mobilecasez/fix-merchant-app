<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640"><title>Signals that stack into a suspension</title>
<defs>
<linearGradient id="bgsignalst" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="1" stop-color="#0d1a30"/></linearGradient>
<radialGradient id="glsignalst" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#38d39a" stop-opacity="0.16"/><stop offset="1" stop-color="#38d39a" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="640" rx="18" fill="url(#bgsignalst)"/>
<circle cx="1050" cy="90" r="260" fill="url(#glsignalst)"/>
<text x="56" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="600" fill="#41c6ee" letter-spacing="3">RARELY A SINGLE FIELD</text>
<text x="56" y="108" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800" fill="#e9f0fa">Signals that stack into a suspension</text><g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><g transform="translate(56,160)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b819c" letter-spacing="2">01</text><text x="72" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">Mass-incorporation cluster</text><text x="24" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">Address shared by hundreds</text><text x="24" y="122" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">of unrelated storefronts</text></g><g transform="translate(424,160)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b819c" letter-spacing="2">02</text><text x="72" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">NAP mismatch</text><text x="24" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">Name, address, phone differ</text><text x="24" y="122" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">across pages and MC</text></g><g transform="translate(792,160)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b819c" letter-spacing="2">03</text><text x="72" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">Brand-implied geography</text><text x="24" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">'London Home Co.' with</text><text x="24" y="122" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">a US phone and .com</text></g><g transform="translate(56,316)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b819c" letter-spacing="2">04</text><text x="72" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">New or masked domain</text><text x="24" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">Under ~90 days old, or</text><text x="24" y="122" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">WHOIS hidden by privacy</text></g><g transform="translate(424,316)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b819c" letter-spacing="2">05</text><text x="72" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">Concealed fulfillment</text><text x="24" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">'Ships overseas 15-30 days'</text><text x="24" y="122" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">buried in fine print</text></g><g transform="translate(792,316)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b819c" letter-spacing="2">06</text><text x="72" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">Contradictory policies</text><text x="24" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">'Free returns' vs</text><text x="24" y="122" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">'all sales final'</text></g><g transform="translate(56,472)"><rect width="352" height="120" rx="14" fill="#0a1526" stroke="#25395a" stroke-width="1"/><text x="24" y="44" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" fill="#e89b3c">Stacked = removed on sight</text><text x="24" y="76" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#9fb2c9">Any one is survivable.</text><text x="24" y="98" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#9fb2c9">Together, no warning.</text></g></g></svg>