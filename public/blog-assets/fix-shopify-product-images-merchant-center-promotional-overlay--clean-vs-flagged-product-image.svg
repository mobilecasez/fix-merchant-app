<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><title>Clean approved product image versus a disapproved image with promotional overlay, logo and watermark</title><defs><linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="1" stop-color="#0d1a30"/></linearGradient><linearGradient id="photoC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13294a"/><stop offset="1" stop-color="#0c1b32"/></linearGradient><radialGradient id="gG" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#38d39a" stop-opacity="0.18"/><stop offset="1" stop-color="#38d39a" stop-opacity="0"/></radialGradient><radialGradient id="gR" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ef6f6f" stop-opacity="0.18"/><stop offset="1" stop-color="#ef6f6f" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="560" rx="18" fill="url(#bgC)" stroke="#25395a" stroke-width="1"/><circle cx="300" cy="300" r="260" fill="url(#gG)"/><circle cx="900" cy="300" r="260" fill="url(#gR)"/><!-- ===== LEFT: CLEAN / APPROVED ===== --><g transform="translate(90,70)"><rect x="0" y="0" width="420" height="420" rx="16" fill="#0e1c34" stroke="#38d39a" stroke-width="1.5"/><rect x="40" y="40" width="340" height="300" rx="12" fill="url(#photoC)" stroke="#25395a" stroke-width="1.5"/><!-- clean product silhouette --><rect x="170" y="150" width="80" height="130" rx="14" fill="#1c3358" stroke="#41c6ee" stroke-width="2.5"/><rect x="194" y="120" width="32" height="34" rx="7" fill="#1c3358" stroke="#41c6ee" stroke-width="2.5"/><line x1="186" y1="200" x2="234" y2="200" stroke="#41c6ee" stroke-width="2" opacity="0.6"/><!-- approved badge --><g transform="translate(340,300)"><circle cx="0" cy="0" r="30" fill="#0a1526" stroke="#38d39a" stroke-width="2.5"/><path d="M -13 1 L -4 11 L 14 -10" fill="none" stroke="#38d39a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="40" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="800" fill="#38d39a">APPROVED</text><text x="40" y="412" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="500" fill="#9fb2c9">Unobstructed view, plain background</text></g><!-- divider VS --><g transform="translate(600,280)"><circle cx="0" cy="0" r="30" fill="#0a1526" stroke="#25395a" stroke-width="1.5"/><text x="0" y="7" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="800" fill="#6b819c">vs</text></g><!-- ===== RIGHT: FLAGGED / DISAPPROVED ===== --><g transform="translate(690,70)"><rect x="0" y="0" width="420" height="420" rx="16" fill="#0e1c34" stroke="#ef6f6f" stroke-width="1.5"/><rect x="40" y="40" width="340" height="300" rx="12" fill="url(#photoC)" stroke="#25395a" stroke-width="1.5"/><!-- same product silhouette --><rect x="170" y="150" width="80" height="130" rx="14" fill="#1c3358" stroke="#41c6ee" stroke-width="2.5"/><rect x="194" y="120" width="32" height="34" rx="7" fill="#1c3358" stroke="#41c6ee" stroke-width="2.5"/><!-- promotional text strip --><rect x="58" y="58" width="150" height="42" rx="9" fill="#e89b3c" opacity="0.95"/><text x="133" y="86" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#0a1526">50% OFF</text><!-- brand logo over product --><circle cx="320" cy="95" r="26" fill="#0a1526" stroke="#9fb2c9" stroke-width="2" opacity="0.85"/><text x="320" y="102" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="800" fill="#9fb2c9" opacity="0.85">LOGO</text><!-- watermark --><text x="210" y="250" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="800" fill="#9fb2c9" opacity="0.40" transform="rotate(-20 210 250)">WATERMARK</text><!-- call to action --><rect x="230" y="294" width="150" height="34" rx="8" fill="#1c3358" stroke="#41c6ee" stroke-width="1.5"/><text x="305" y="317" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#41c6ee">Buy now</text><!-- disapproved badge --><g transform="translate(340,300)"><circle cx="0" cy="0" r="30" fill="#0a1526" stroke="#ef6f6f" stroke-width="2.5"/><line x1="-11" y1="-11" x2="11" y2="11" stroke="#ef6f6f" stroke-width="4.5" stroke-linecap="round"/><line x1="11" y1="-11" x2="-11" y2="11" stroke="#ef6f6f" stroke-width="4.5" stroke-linecap="round"/></g><text x="40" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="800" fill="#ef6f6f">DISAPPROVED</text><text x="40" y="412" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="500" fill="#9fb2c9">Promotional overlay on image</text></g></svg>
