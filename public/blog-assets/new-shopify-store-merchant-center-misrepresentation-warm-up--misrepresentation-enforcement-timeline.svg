<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><title>Misrepresentation enforcement timeline: non-egregious versus egregious</title>
<defs>
<linearGradient id="bgf2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="1" stop-color="#0d1a30"/></linearGradient>
<radialGradient id="g2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e89b3c" stop-opacity="0.14"/><stop offset="1" stop-color="#e89b3c" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="560" rx="18" fill="url(#bgf2)"/>
<circle cx="600" cy="40" r="300" fill="url(#g2)"/>
<text x="56" y="62" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="600" letter-spacing="3" fill="#41c6ee">HOW ENFORCEMENT WORKS</text>
<text x="56" y="104" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800" fill="#e9f0fa">Misrepresentation enforcement timeline</text>
<g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<text x="56" y="168" font-size="19" font-weight="700" fill="#e89b3c">Non-egregious violation</text>
<line x1="120" y1="248" x2="1010" y2="248" stroke="#25395a" stroke-width="2"/>
<g transform="translate(120,248)"><circle r="13" fill="#0a1526" stroke="#e89b3c" stroke-width="2"/><circle r="4" fill="#e89b3c"/></g>
<text x="68" y="212" font-size="18" font-weight="700" fill="#e9f0fa">Warning email</text>
<text x="68" y="300" font-size="15.5" fill="#9fb2c9">Issue flagged,</text><text x="68" y="320" font-size="15.5" fill="#9fb2c9">not yet suspended</text>
<g transform="translate(565,248)"><circle r="13" fill="#0a1526" stroke="#41c6ee" stroke-width="2"/><circle r="4" fill="#41c6ee"/></g>
<rect x="430" y="176" width="270" height="50" rx="12" fill="#0e1c34" stroke="#41c6ee" stroke-width="1.5"/><text x="565" y="207" font-size="19" font-weight="800" fill="#41c6ee" text-anchor="middle">7 or 28 calendar days</text>
<text x="565" y="300" font-size="15.5" fill="#38d39a" text-anchor="middle">Window to fix the issue —</text><text x="565" y="320" font-size="15.5" fill="#38d39a" text-anchor="middle">products keep showing</text>
<g transform="translate(1010,248)"><circle r="13" fill="#0a1526" stroke="#ef6f6f" stroke-width="2"/><circle r="4" fill="#ef6f6f"/></g>
<text x="1064" y="212" font-size="18" font-weight="700" fill="#ef6f6f" text-anchor="end">Suspension</text>
<text x="1064" y="300" font-size="15.5" fill="#9fb2c9" text-anchor="end">Only if</text><text x="1064" y="320" font-size="15.5" fill="#9fb2c9" text-anchor="end">unresolved</text>
<line x1="56" y1="384" x2="1144" y2="384" stroke="#25395a" stroke-width="1"/>
<text x="56" y="432" font-size="19" font-weight="700" fill="#ef6f6f">Egregious violation</text>
<g transform="translate(120,484)"><circle r="13" fill="#0a1526" stroke="#ef6f6f" stroke-width="2"/><path d="M -5 -5 L 5 5 M 5 -5 L -5 5" stroke="#ef6f6f" stroke-width="2.5" stroke-linecap="round"/></g>
<line x1="133" y1="484" x2="360" y2="484" stroke="#ef6f6f" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
<g transform="translate(360,484)"><circle r="13" fill="#0a1526" stroke="#ef6f6f" stroke-width="2"/><circle r="4" fill="#ef6f6f"/></g>
<text x="68" y="452" font-size="18" font-weight="700" fill="#e9f0fa">Detection</text>
<text x="394" y="479" font-size="18" font-weight="800" fill="#ef6f6f">Suspended on detection</text><text x="394" y="503" font-size="15.5" fill="#9fb2c9">without prior warning — no fix window</text>
</g>
</svg>
