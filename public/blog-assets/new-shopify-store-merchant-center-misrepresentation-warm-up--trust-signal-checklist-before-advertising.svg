<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640"><title>Trust-signal checklist to complete before you advertise</title>
<defs>
<linearGradient id="bgf1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="1" stop-color="#0d1a30"/></linearGradient>
<radialGradient id="g1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#38d39a" stop-opacity="0.16"/><stop offset="1" stop-color="#38d39a" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="640" rx="18" fill="url(#bgf1)"/>
<circle cx="1050" cy="90" r="260" fill="url(#g1)"/>
<text x="56" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="600" letter-spacing="3" fill="#41c6ee">BEFORE YOU ADVERTISE</text>
<text x="56" y="108" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800" fill="#e9f0fa">The trust-signal checklist</text>
<g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<g transform="translate(56,160)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-size="15" font-weight="700" letter-spacing="2" fill="#6b819c">01</text><text x="72" y="66" font-size="20" font-weight="700" fill="#e9f0fa">Consistent contact info</text><text x="24" y="100" font-size="16" fill="#9fb2c9">Address, phone, on-domain email,</text><text x="24" y="122" font-size="16" fill="#9fb2c9">contact form, footer + page</text></g>
<g transform="translate(424,160)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-size="15" font-weight="700" letter-spacing="2" fill="#6b819c">02</text><text x="72" y="66" font-size="20" font-weight="700" fill="#e9f0fa">Clear, discoverable policies</text><text x="24" y="100" font-size="16" fill="#9fb2c9">Shipping, return, refund — linked</text><text x="24" y="122" font-size="16" fill="#9fb2c9">in footer, matching the feed</text></g>
<g transform="translate(792,160)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-size="15" font-weight="700" letter-spacing="2" fill="#6b819c">03</text><text x="72" y="66" font-size="20" font-weight="700" fill="#e9f0fa">Authentic About Us page</text><text x="24" y="100" font-size="16" fill="#9fb2c9">Real story: who runs it, what</text><text x="24" y="122" font-size="16" fill="#9fb2c9">you sell, why — not templated</text></g>
<g transform="translate(56,316)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-size="15" font-weight="700" letter-spacing="2" fill="#6b819c">04</text><text x="72" y="66" font-size="20" font-weight="700" fill="#e9f0fa">One business name (NAP)</text><text x="24" y="100" font-size="16" fill="#9fb2c9">Name, address, phone match across</text><text x="24" y="122" font-size="16" fill="#9fb2c9">Merchant Center, Ads, Payments</text></g>
<g transform="translate(424,316)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-size="15" font-weight="700" letter-spacing="2" fill="#6b819c">05</text><text x="72" y="66" font-size="20" font-weight="700" fill="#e9f0fa">HTTPS + working checkout</text><text x="24" y="100" font-size="16" fill="#9fb2c9">Whole domain on https, test</text><text x="24" y="122" font-size="16" fill="#9fb2c9">checkout, no Lorem ipsum</text></g>
<g transform="translate(792,316)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-size="15" font-weight="700" letter-spacing="2" fill="#6b819c">06</text><text x="72" y="66" font-size="20" font-weight="700" fill="#e9f0fa">Feed-to-site parity</text><text x="24" y="100" font-size="16" fill="#9fb2c9">Every price and stock value</text><text x="24" y="122" font-size="16" fill="#9fb2c9">matches the live product page</text></g>
<g transform="translate(424,472)"><rect width="352" height="120" rx="14" fill="#0e1c34" stroke="#41c6ee" stroke-width="1.5"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-size="15" font-weight="700" letter-spacing="2" fill="#6b819c">07</text><text x="72" y="66" font-size="20" font-weight="700" fill="#e9f0fa">Genuine reputation signals</text><text x="24" y="100" font-size="16" fill="#9fb2c9">Real review app + Google Business Profile</text></g>
<g transform="translate(56,472)"><rect width="352" height="120" rx="14" fill="#0a1526" stroke="#25395a" stroke-width="1"/><text x="24" y="44" font-size="17" font-weight="700" fill="#e89b3c">Fix the whole picture first</text><text x="24" y="76" font-size="15.5" fill="#9fb2c9">Fixing one thing, appealing, and</text><text x="24" y="98" font-size="15.5" fill="#9fb2c9">repeating only lengthens suspensions.</text></g>
<g transform="translate(792,472)"><rect width="352" height="120" rx="14" fill="#0a1526" stroke="#25395a" stroke-width="1"/><text x="24" y="44" font-size="17" font-weight="700" fill="#41c6ee">Then request a review</text><text x="24" y="76" font-size="15.5" fill="#9fb2c9">Complete every item, pass the first</text><text x="24" y="98" font-size="15.5" fill="#9fb2c9">review cleanly, then start ads.</text></g>
</g>
</svg>
