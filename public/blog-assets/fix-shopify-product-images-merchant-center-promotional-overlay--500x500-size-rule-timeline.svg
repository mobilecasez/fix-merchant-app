<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500"><title>Timeline of the 500x500 pixel minimum image size rule</title><defs><linearGradient id="bgT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="1" stop-color="#0d1a30"/></linearGradient></defs><rect width="500" height="500" rx="16" fill="url(#bgT)" stroke="#25395a" stroke-width="1"/><text x="32" y="46" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#e9f0fa">The 500x500 size rule</text><text x="32" y="72" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#9fb2c9">image_link &amp; additional_image_link, all categories</text><!-- timeline rail --><line x1="60" y1="118" x2="60" y2="330" stroke="#25395a" stroke-width="2"/><!-- node 1: warnings began --><circle cx="60" cy="130" r="9" fill="#0a1526" stroke="#e89b3c" stroke-width="3"/><text x="86" y="126" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="800" fill="#e89b3c">April 14, 2026</text><text x="86" y="148" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#9fb2c9">Warnings began appearing</text><text x="86" y="167" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="500" fill="#6b819c">&#8220;Image too small for upcoming</text><text x="86" y="183" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="500" fill="#6b819c">enforcement&#8221; in Needs attention</text><!-- node 2: today / not disapproved --><circle cx="60" cy="230" r="9" fill="#0a1526" stroke="#41c6ee" stroke-width="3"/><text x="86" y="226" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="800" fill="#41c6ee">Today</text><text x="86" y="248" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#9fb2c9">Products with the warning are</text><text x="86" y="266" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#38d39a">NOT disapproved yet</text><!-- node 3: enforcement --><circle cx="60" cy="320" r="9" fill="#0a1526" stroke="#ef6f6f" stroke-width="3"/><text x="86" y="316" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="800" fill="#ef6f6f">January 31, 2027</text><text x="86" y="338" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#9fb2c9">Enforcement begins &#8212; 500x500</text><text x="86" y="356" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#9fb2c9">minimum required</text><!-- current minimums panel --><rect x="32" y="392" width="436" height="82" rx="12" fill="#0a1526" stroke="#25395a" stroke-width="1"/><text x="48" y="418" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6b819c">CURRENT ENFORCED MINIMUMS</text><text x="48" y="452" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="800" fill="#e9f0fa">100x100</text><text x="48" y="470" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="500" fill="#9fb2c9">non-apparel px</text><line x1="250" y1="432" x2="250" y2="462" stroke="#25395a" stroke-width="1"/><text x="282" y="452" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="800" fill="#e9f0fa">250x250</text><text x="282" y="470" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="500" fill="#9fb2c9">apparel px</text></svg>
