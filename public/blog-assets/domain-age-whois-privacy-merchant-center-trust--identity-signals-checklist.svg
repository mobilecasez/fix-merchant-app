<text x="56" y="108" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800" fill="#e9f0fa">Identity signals to get exactly right</text><g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><g transform="translate(56,160)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b819c" letter-spacing="2">01</text><text x="72" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">Reachable contact info</text><text x="24" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">Real address, phone, email</text><text x="24" y="122" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">in footer + Contact page</text></g><g transform="translate(424,160)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b819c" letter-spacing="2">02</text><text x="72" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">NAP consistency</text><text x="24" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">Name, address, phone match</text><text x="24" y="122" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">across every surface</text></g><g transform="translate(792,160)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b819c" letter-spacing="2">03</text><text x="72" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">Brand-implied geography</text><text x="24" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">“London Leather” must match</text><text x="24" y="122" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">address, phone, currency, TLD</text></g><g transform="translate(56,316)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b819c" letter-spacing="2">04</text><text x="72" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">Fulfillment origin</text><text x="24" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">Disclose overseas shipping</text><text x="24" y="122" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">and honest delivery times</text></g><g transform="translate(424,316)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b819c" letter-spacing="2">05</text><text x="72" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">No policy contradictions</text><text x="24" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">Refund, terms, shipping windows</text><text x="24" y="122" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">must agree with each other</text></g><g transform="translate(792,316)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b819c" letter-spacing="2">06</text><text x="72" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">Stable domain ownership</text><text x="24" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">Registered to your entity;</text><text x="24" y="122" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">no last-minute transfers</text></g></g></svg>