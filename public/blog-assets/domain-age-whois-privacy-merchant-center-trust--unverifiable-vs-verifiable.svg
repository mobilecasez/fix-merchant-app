<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><title>What a new-domain review sees</title>
<defs>
<linearGradient id="bgunverifi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="1" stop-color="#0d1a30"/></linearGradient>
<radialGradient id="glunverifi" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#38d39a" stop-opacity="0.16"/><stop offset="1" stop-color="#38d39a" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="560" rx="18" fill="url(#bgunverifi)"/>
<circle cx="1050" cy="90" r="260" fill="url(#glunverifi)"/>
<text x="56" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="600" fill="#41c6ee" letter-spacing="3">SAME HONESTY, DIFFERENT OUTCOME</text>
<text x="56" y="108" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800" fill="#e9f0fa">What a new-domain review sees</text><g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><g transform="translate(56,158)"><rect width="520" height="360" rx="16" fill="#0e1c34" stroke="#e2604f" stroke-width="1.5"/><text x="30" y="52" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#e2604f">Reads as unverifiable</text><circle cx="42" cy="93" r="12" fill="#0a1526" stroke="#e2604f" stroke-width="1.5"/><path d="M 37 88 L 47 98 M 47 88 L 37 98" stroke="#e2604f" stroke-width="2.5" stroke-linecap="round"/><text x="66" y="98" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">Domain only a few weeks old</text><circle cx="42" cy="135" r="12" fill="#0a1526" stroke="#e2604f" stroke-width="1.5"/><path d="M 37 130 L 47 140 M 47 130 L 37 140" stroke="#e2604f" stroke-width="2.5" stroke-linecap="round"/><text x="66" y="140" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">Registrant masked by WHOIS privacy</text><circle cx="42" cy="177" r="12" fill="#0a1526" stroke="#e2604f" stroke-width="1.5"/><path d="M 37 172 L 47 182 M 47 172 L 37 182" stroke="#e2604f" stroke-width="2.5" stroke-linecap="round"/><text x="66" y="182" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">No reviews, press or directory mentions</text><circle cx="42" cy="219" r="12" fill="#0a1526" stroke="#e2604f" stroke-width="1.5"/><path d="M 37 214 L 47 224 M 47 214 L 37 224" stroke="#e2604f" stroke-width="2.5" stroke-linecap="round"/><text x="66" y="224" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">Generic Gmail, no phone number</text><circle cx="42" cy="261" r="12" fill="#0a1526" stroke="#e2604f" stroke-width="1.5"/><path d="M 37 256 L 47 266 M 47 256 L 37 266" stroke="#e2604f" stroke-width="2.5" stroke-linecap="round"/><text x="66" y="266" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">Brand name ≠ the name on policies</text></g><g transform="translate(624,158)"><rect width="520" height="360" rx="16" fill="#0e1c34" stroke="#38d39a" stroke-width="1.5"/><text x="30" y="52" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#38d39a">Reads as legitimate</text><circle cx="42" cy="93" r="12" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 36 93 L 41 98 L 49 87" fill="none" stroke="#38d39a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="98" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">Owned by the business entity, stable</text><circle cx="42" cy="135" r="12" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 36 135 L 41 140 L 49 129" fill="none" stroke="#38d39a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="140" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">Consistent NAP on every surface</text><circle cx="42" cy="177" r="12" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 36 177 L 41 182 L 49 171" fill="none" stroke="#38d39a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="182" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">Real address, phone and support email</text><circle cx="42" cy="219" r="12" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 36 219 L 41 224 L 49 213" fill="none" stroke="#38d39a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="224" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">Brand-to-legal-name link stated plainly</text><circle cx="42" cy="261" r="12" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 36 261 L 41 266 L 49 255" fill="none" stroke="#38d39a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="266" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">Small off-site footprint, matching NAP</text></g></g></svg>