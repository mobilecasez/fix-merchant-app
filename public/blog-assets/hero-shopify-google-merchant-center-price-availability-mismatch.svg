<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><title>Mismatched price and availability feed disapprovals on Shopify</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="1" stop-color="#0d1a30"/></linearGradient>
<radialGradient id="glowAmber" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e89b3c" stop-opacity="0.30"/><stop offset="1" stop-color="#e89b3c" stop-opacity="0"/></radialGradient>
<radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#41c6ee" stop-opacity="0.22"/><stop offset="1" stop-color="#41c6ee" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="930" cy="300" r="300" fill="url(#glowAmber)"/>
<circle cx="180" cy="520" r="240" fill="url(#glowCyan)"/>

<!-- faint dot grid motif -->
<g fill="#25395a" opacity="0.45">
<circle cx="80" cy="90" r="2"/><circle cx="140" cy="90" r="2"/><circle cx="200" cy="90" r="2"/><circle cx="260" cy="90" r="2"/><circle cx="320" cy="90" r="2"/>
<circle cx="80" cy="150" r="2"/><circle cx="140" cy="150" r="2"/><circle cx="200" cy="150" r="2"/><circle cx="260" cy="150" r="2"/><circle cx="320" cy="150" r="2"/>
<circle cx="80" cy="210" r="2"/><circle cx="140" cy="210" r="2"/><circle cx="200" cy="210" r="2"/><circle cx="260" cy="210" r="2"/><circle cx="320" cy="210" r="2"/>
</g>

<!-- eyebrow -->
<text x="90" y="232" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#41c6ee">FEED DISAPPROVALS</text>

<!-- short thematic phrase -->
<text x="88" y="318" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="78" font-weight="800" fill="#e9f0fa">Feed vs. Page</text>
<text x="88" y="404" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="78" font-weight="800" fill="#e89b3c">Price Mismatch</text>

<text x="90" y="466" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="23" font-weight="400" fill="#9fb2c9">When your feed, landing page &amp; structured data disagree.</text>

<!-- topical icon: two compared price tags with a mismatch bolt -->
<g transform="translate(820,170)">
<!-- feed tag -->
<g transform="translate(0,0)">
<rect x="0" y="0" width="200" height="120" rx="18" fill="#0e1c34" stroke="#25395a" stroke-width="1.5"/>
<circle cx="34" cy="34" r="9" fill="none" stroke="#41c6ee" stroke-width="2"/>
<text x="58" y="42" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#9fb2c9">FEED</text>
<text x="24" y="90" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="800" fill="#41c6ee">$24.00</text>
</g>
<!-- page tag -->
<g transform="translate(0,160)">
<rect x="0" y="0" width="200" height="120" rx="18" fill="#0e1c34" stroke="#25395a" stroke-width="1.5"/>
<circle cx="34" cy="34" r="9" fill="none" stroke="#e89b3c" stroke-width="2"/>
<text x="58" y="42" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#9fb2c9">PAGE</text>
<text x="24" y="90" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="800" fill="#e89b3c">$19.50</text>
</g>

<!-- not-equal connector -->
<g transform="translate(240,140)">
<circle cx="0" cy="0" r="40" fill="#0a1526" stroke="#ef6f6f" stroke-width="2"/>
<line x1="-18" y1="-9" x2="18" y2="-9" stroke="#ef6f6f" stroke-width="4" stroke-linecap="round"/>
<line x1="-18" y1="9" x2="18" y2="9" stroke="#ef6f6f" stroke-width="4" stroke-linecap="round"/>
<line x1="-16" y1="20" x2="16" y2="-20" stroke="#ef6f6f" stroke-width="4" stroke-linecap="round"/>
</g>
<line x1="200" y1="60" x2="240" y2="120" stroke="#25395a" stroke-width="1.5"/>
<line x1="200" y1="220" x2="240" y2="160" stroke="#25395a" stroke-width="1.5"/>

<!-- disapproved chip -->
<g transform="translate(220,300)">
<rect x="0" y="0" width="180" height="46" rx="14" fill="#0a1526" stroke="#ef6f6f" stroke-width="1.5"/>
<circle cx="26" cy="23" r="9" fill="none" stroke="#ef6f6f" stroke-width="2"/>
<line x1="22" y1="19" x2="30" y2="27" stroke="#ef6f6f" stroke-width="2" stroke-linecap="round"/>
<line x1="30" y1="19" x2="22" y2="27" stroke="#ef6f6f" stroke-width="2" stroke-linecap="round"/>
<text x="46" y="29" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#ef6f6f">Disapproved</text>
</g>
</g>
</svg>
