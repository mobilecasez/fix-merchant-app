<text x="56" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="600" fill="#41c6ee" letter-spacing="3">TIER 3 — WHAT PAGE SCANNERS MISS</text>
<text x="56" y="108" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800" fill="#e9f0fa">The Trust &amp; Identity layer</text><g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><g transform="translate(56,160)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b819c" letter-spacing="2">01</text><text x="72" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">Registered-agent address</text><text x="24" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">Mail-drop shared by shells</text><text x="24" y="122" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">Use a real location</text></g><g transform="translate(424,160)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b819c" letter-spacing="2">02</text><text x="72" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">Brand vs geography</text><text x="24" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">&quot;London&quot; brand, US address</text><text x="24" y="122" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">Align it or drop it</text></g><g transform="translate(792,160)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b819c" letter-spacing="2">03</text><text x="72" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">Domain age &amp; WHOIS</text><text x="24" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">Under 90 days draws heat</text><text x="24" y="122" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">Privacy needs offsetting</text></g><g transform="translate(56,316)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b819c" letter-spacing="2">04</text><text x="72" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">Concealed fulfillment</text><text x="24" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">Hidden overseas origin</text><text x="24" y="122" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">Disclose it up front</text></g><g transform="translate(424,316)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b819c" letter-spacing="2">05</text><text x="72" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">NAP consistency</text><text x="24" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">Name, address, phone match</text><text x="24" y="122" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">Across every page</text></g><g transform="translate(792,316)"><rect width="352" height="138" rx="14" fill="#0e1c34" stroke="#25395a" stroke-width="1"/><circle cx="38" cy="42" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 31 42 L 36 48 L 46 35" fill="none" stroke="#38d39a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#6b819c" letter-spacing="2">06</text><text x="72" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">Policy contradictions</text><text x="24" y="100" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">14-day vs 30-day returns</text><text x="24" y="122" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="#9fb2c9">Reviewers cross-check</text></g><g transform="translate(56,472)"><rect width="352" height="120" rx="14" fill="#0a1526" stroke="#25395a" stroke-width="1"/><text x="24" y="44" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" fill="#e89b3c">Why 'clean' stores still fail</text><text x="24" y="76" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#9fb2c9">They pass every checklist</text><text x="24" y="98" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#9fb2c9">but fail the identity layer</text></g></g></svg>