<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><title>Why products are disapproved on Google Shopping — 8 fixable reasons</title>
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="1" stop-color="#0d1a30"/></linearGradient>
  <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ef6f6f" stop-opacity="0.30"/><stop offset="1" stop-color="#ef6f6f" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#41c6ee" stop-opacity="0.22"/><stop offset="1" stop-color="#41c6ee" stop-opacity="0"/></radialGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1c34"/><stop offset="1" stop-color="#0a1526"/></linearGradient>
 </defs>
 <rect width="1200" height="630" fill="url(#bg)"/>
 <g opacity="0.5">
  <circle cx="960" cy="300" r="300" fill="url(#glowC)"/>
  <circle cx="905" cy="250" r="220" fill="url(#glowR)"/>
 </g>
 <g fill="#25395a" opacity="0.30">
  <circle cx="80" cy="70" r="2.5"/><circle cx="140" cy="70" r="2.5"/><circle cx="200" cy="70" r="2.5"/><circle cx="80" cy="130" r="2.5"/><circle cx="140" cy="130" r="2.5"/><circle cx="200" cy="130" r="2.5"/>
  <circle cx="80" cy="540" r="2.5"/><circle cx="140" cy="540" r="2.5"/><circle cx="80" cy="500" r="2.5"/><circle cx="140" cy="500" r="2.5"/><circle cx="200" cy="540" r="2.5"/>
 </g>
 <!-- LEFT: text block -->
 <g>
  <rect x="96" y="196" width="13" height="13" rx="3" fill="#e89b3c"/>
  <text x="124" y="207" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#e89b3c">PRODUCT DISAPPROVALS</text>
  <text x="94" y="300" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="96" font-weight="800" fill="#e9f0fa" letter-spacing="-2">8 Fixable</text>
  <text x="94" y="396" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="96" font-weight="800" fill="#41c6ee" letter-spacing="-2">Reasons</text>
  <text x="96" y="452" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="23" font-weight="500" fill="#9fb2c9">Why Shopify products get rejected on Google Shopping</text>
 </g>
 <!-- RIGHT: product card with disapproval mark + checklist -->
 <g transform="translate(760,150)">
  <!-- main product card -->
  <rect x="0" y="0" width="340" height="330" rx="18" fill="url(#card)" stroke="#25395a" stroke-width="1.5"/>
  <!-- image area -->
  <rect x="28" y="28" width="284" height="150" rx="12" fill="#0a1526" stroke="#25395a" stroke-width="1.5"/>
  <rect x="120" y="78" width="100" height="56" rx="8" fill="#13243f"/>
  <path d="M120 134 L150 100 L172 122 L196 92 L220 134 Z" fill="#25395a"/>
  <circle cx="186" cy="78" r="11" fill="#25395a"/>
  <!-- title + price lines -->
  <rect x="28" y="196" width="170" height="14" rx="7" fill="#25395a"/>
  <rect x="28" y="224" width="240" height="11" rx="5.5" fill="#1a2c4a"/>
  <rect x="28" y="246" width="200" height="11" rx="5.5" fill="#1a2c4a"/>
  <!-- price chip -->
  <rect x="28" y="280" width="92" height="30" rx="8" fill="#0a1526" stroke="#ef6f6f" stroke-width="1.5"/>
  <text x="74" y="301" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" fill="#ef6f6f" text-anchor="middle">$ — ?</text>
  <!-- disapproved badge -->
  <g transform="translate(252,272)">
   <circle cx="22" cy="22" r="28" fill="url(#glowR)"/>
   <circle cx="22" cy="22" r="20" fill="#0a1526" stroke="#ef6f6f" stroke-width="2"/>
   <path d="M14 14 L30 30 M30 14 L14 30" stroke="#ef6f6f" stroke-width="3" stroke-linecap="round"/>
  </g>
 </g>
 <!-- floating fix checklist card -->
 <g transform="translate(688,392)">
  <rect x="0" y="0" width="300" height="150" rx="16" fill="url(#card)" stroke="#25395a" stroke-width="1.5"/>
  <text x="22" y="36" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="1" fill="#9fb2c9">FIX CHECKLIST</text>
  <g transform="translate(22,56)">
   <circle cx="11" cy="11" r="11" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/>
   <path d="M6 11 L10 15 L17 7" stroke="#38d39a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
   <text x="34" y="16" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#e9f0fa">Match price &amp; stock</text>
  </g>
  <g transform="translate(22,92)">
   <circle cx="11" cy="11" r="11" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/>
   <path d="M6 11 L10 15 L17 7" stroke="#38d39a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
   <text x="34" y="16" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#e9f0fa">Add GTIN / brand</text>
  </g>
  <g transform="translate(22,118)">
   <circle cx="11" cy="11" r="11" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/>
   <path d="M6 11 L10 15 L17 7" stroke="#38d39a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
   <text x="34" y="16" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#e9f0fa">Clean image &amp; HTTPS</text>
  </g>
 </g>
</svg>
