<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><title>Import AliExpress and Amazon products without disapproval — Dropshipping</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="1" stop-color="#0d1a30"/></linearGradient>
<radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#41c6ee" stop-opacity="0.30"/><stop offset="1" stop-color="#41c6ee" stop-opacity="0"/></radialGradient>
<radialGradient id="glowG" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#38d39a" stop-opacity="0.22"/><stop offset="1" stop-color="#38d39a" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1c34"/><stop offset="1" stop-color="#0a1526"/></linearGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<!-- decorative dot grid -->
<g fill="#25395a" opacity="0.45">
<circle cx="70" cy="90" r="2"/><circle cx="130" cy="90" r="2"/><circle cx="190" cy="90" r="2"/><circle cx="250" cy="90" r="2"/><circle cx="310" cy="90" r="2"/>
<circle cx="70" cy="150" r="2"/><circle cx="130" cy="150" r="2"/><circle cx="190" cy="150" r="2"/><circle cx="250" cy="150" r="2"/><circle cx="310" cy="150" r="2"/>
<circle cx="70" cy="210" r="2"/><circle cx="130" cy="210" r="2"/><circle cx="190" cy="210" r="2"/><circle cx="250" cy="210" r="2"/>
</g>
<circle cx="980" cy="300" r="320" fill="url(#glowC)"/>
<circle cx="760" cy="540" r="240" fill="url(#glowG)"/>

<!-- LEFT: text block -->
<text x="90" y="250" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#41c6ee">DROPSHIPPING</text>
<text x="88" y="338" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="78" font-weight="800" fill="#e9f0fa">Import Clean,</text>
<text x="88" y="424" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="78" font-weight="800" fill="#e9f0fa">Stay <tspan fill="#38d39a">Approved</tspan></text>
<text x="90" y="486" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="23" font-weight="400" fill="#9fb2c9">Differentiate every supplier listing for Merchant Center</text>

<!-- RIGHT: topical icon illustration — supplier product card transforming into an approved listing -->
<g transform="translate(770,150)">
<!-- rejected card (back) -->
<g transform="translate(0,40) rotate(-6 110 165)">
<rect x="0" y="0" width="220" height="330" rx="16" fill="url(#panel)" stroke="#25395a" stroke-width="1.5"/>
<rect x="22" y="24" width="176" height="120" rx="10" fill="#0a1526" stroke="#25395a" stroke-width="1.5"/>
<!-- watermark mark -->
<text x="110" y="92" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#ef6f6f" opacity="0.55" text-anchor="middle" transform="rotate(-18 110 88)">WATERMARK</text>
<rect x="22" y="166" width="176" height="11" rx="5.5" fill="#ef6f6f" opacity="0.5"/>
<rect x="22" y="188" width="140" height="11" rx="5.5" fill="#2a3f60"/>
<rect x="22" y="210" width="160" height="11" rx="5.5" fill="#2a3f60"/>
<!-- reject badge -->
<circle cx="196" cy="14" r="20" fill="#0a1526" stroke="#ef6f6f" stroke-width="2"/>
<path d="M188 6 L204 22 M204 6 L188 22" stroke="#ef6f6f" stroke-width="3" stroke-linecap="round"/>
</g>
<!-- approved card (front) -->
<g transform="translate(150,0)">
<rect x="0" y="0" width="240" height="360" rx="18" fill="url(#panel)" stroke="#38d39a" stroke-width="1.5"/>
<rect x="24" y="26" width="192" height="130" rx="12" fill="#0a1526" stroke="#25395a" stroke-width="1.5"/>
<!-- clean product shape -->
<rect x="78" y="60" width="84" height="62" rx="10" fill="none" stroke="#41c6ee" stroke-width="2.5"/>
<circle cx="120" cy="91" r="14" fill="none" stroke="#41c6ee" stroke-width="2.5"/>
<rect x="24" y="178" width="150" height="13" rx="6.5" fill="#e9f0fa"/>
<rect x="24" y="204" width="192" height="10" rx="5" fill="#2a3f60"/>
<rect x="24" y="224" width="170" height="10" rx="5" fill="#2a3f60"/>
<!-- identifier chip -->
<rect x="24" y="256" width="118" height="30" rx="8" fill="#0a1526" stroke="#41c6ee" stroke-width="1.5"/>
<text x="83" y="276" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#41c6ee" text-anchor="middle">GTIN ✓</text>
<!-- approve badge -->
<circle cx="216" cy="16" r="22" fill="#0a1526" stroke="#38d39a" stroke-width="2"/>
<path d="M206 16 l7 7 l13 -14" fill="none" stroke="#38d39a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- transform arrow -->
<g transform="translate(120,300)">
<path d="M0 0 L60 0" stroke="#9fb2c9" stroke-width="3" stroke-linecap="round"/>
<path d="M52 -7 L62 0 L52 7" fill="none" stroke="#9fb2c9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</g>
</svg>
