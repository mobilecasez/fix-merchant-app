<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><title>Decision tree for choosing GTIN, MPN plus brand, or identifier_exists no</title>
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="1" stop-color="#0d1a30"/></linearGradient>
</defs>
<rect width="1200" height="620" rx="18" fill="url(#bg2)" stroke="#25395a" stroke-width="1"/>
<!-- Root question -->
<rect x="360" y="40" width="480" height="96" rx="16" fill="#0e1c34" stroke="#41c6ee" stroke-width="1.5"/>
<text x="600" y="80" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" fill="#e9f0fa">Does the product have a</text>
<text x="600" y="110" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" fill="#e9f0fa">manufacturer GTIN?</text>
<!-- Connectors -->
<path d="M600 136 L600 168 M210 168 L990 168 M210 168 L210 210 M600 168 L600 210 M990 168 L990 210" fill="none" stroke="#25395a" stroke-width="1.5"/>
<!-- Branch labels -->
<text x="210" y="196" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" fill="#38d39a">YES</text>
<text x="600" y="196" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" fill="#e89b3c">NO, BUT BRANDED</text>
<text x="990" y="196" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" fill="#ef6f6f">NO IDENTIFIER AT ALL</text>
<!-- Card 1: YES -->
<g>
<rect x="40" y="210" width="340" height="330" rx="16" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/>
<circle cx="80" cy="252" r="15" fill="none" stroke="#38d39a" stroke-width="2"/><path d="M73 252 l5 6 l10 -12" fill="none" stroke="#38d39a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="110" y="259" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="700" fill="#e9f0fa">Use the real GTIN</text>
<text x="72" y="308" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#9fb2c9">Enter it in the variant</text>
<text x="72" y="334" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#9fb2c9">Shopify Barcode field.</text>
<rect x="72" y="364" width="276" height="54" rx="10" fill="#0e1c34" stroke="#25395a" stroke-width="1"/>
<text x="90" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1" fill="#6b819c">BARCODE</text>
<text x="90" y="409" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" fill="#41c6ee">ISBN, UPC, GTIN, etc.</text>
<text x="72" y="462" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#9fb2c9">Sent to Merchant Center</text>
<text x="72" y="487" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#9fb2c9">as the gtin attribute.</text>
<text x="72" y="518" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#38d39a">Set custom product = false</text>
</g>
<!-- Card 2: MPN + brand -->
<g>
<rect x="430" y="210" width="340" height="330" rx="16" fill="#0a1526" stroke="#e89b3c" stroke-width="1.5"/>
<rect x="465" y="240" width="24" height="24" rx="6" fill="none" stroke="#e89b3c" stroke-width="2"/><line x1="471" y1="252" x2="483" y2="252" stroke="#e89b3c" stroke-width="2" stroke-linecap="round"/>
<text x="500" y="259" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="700" fill="#e9f0fa">Supply MPN + brand</text>
<text x="462" y="308" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#9fb2c9">An accurate MPN + brand</text>
<text x="462" y="334" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#9fb2c9">is an acceptable substitute.</text>
<rect x="462" y="360" width="130" height="46" rx="10" fill="#0e1c34" stroke="#e89b3c" stroke-width="1.2"/>
<text x="527" y="389" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#e89b3c">MPN</text>
<rect x="606" y="360" width="134" height="46" rx="10" fill="#0e1c34" stroke="#e89b3c" stroke-width="1.2"/>
<text x="673" y="389" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#e89b3c">brand</text>
<text x="462" y="446" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#9fb2c9">Private-label or store-brand?</text>
<text x="462" y="471" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#9fb2c9">Use your store name as</text>
<text x="462" y="496" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#9fb2c9">the brand. brand is 1-70 chars.</text>
<text x="462" y="522" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#e89b3c">Do not set identifier_exists=false</text>
</g>
<!-- Card 3: identifier_exists no -->
<g>
<rect x="820" y="210" width="340" height="330" rx="16" fill="#0a1526" stroke="#ef6f6f" stroke-width="1.5"/>
<circle cx="860" cy="252" r="15" fill="none" stroke="#ef6f6f" stroke-width="2"/><line x1="853" y1="245" x2="867" y2="259" stroke="#ef6f6f" stroke-width="2.5" stroke-linecap="round"/><line x1="867" y1="245" x2="853" y2="259" stroke="#ef6f6f" stroke-width="2.5" stroke-linecap="round"/>
<text x="890" y="259" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#e9f0fa">identifier_exists</text>
<rect x="852" y="288" width="110" height="48" rx="10" fill="#0e1c34" stroke="#ef6f6f" stroke-width="1.5"/>
<text x="907" y="319" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="800" fill="#ef6f6f">= no</text>
<text x="852" y="376" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#9fb2c9">Only for truly</text>
<text x="852" y="401" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#9fb2c9">identifier-free goods:</text>
<text x="852" y="434" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#e9f0fa">&#8226; Custom / handmade</text>
<text x="852" y="461" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#e9f0fa">&#8226; Vintage &amp; antiques</text>
<text x="852" y="488" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#e9f0fa">&#8226; Books before 1970</text>
<text x="852" y="520" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#ef6f6f">No brand or GTIN, or it backfires</text>
</g>
<text x="600" y="586" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#6b819c">Each color or size variant needs its own unique identifier.</text>
</svg>
