<text x="56" y="108" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800" fill="#e9f0fa">Concealed vs disclosed</text><g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><g transform="translate(56,158)"><rect width="520" height="360" rx="16" fill="#0e1c34" stroke="#e2604f" stroke-width="1.5"/><text x="30" y="52" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#e2604f">Concealed store</text><circle cx="42" cy="93" r="12" fill="#0a1526" stroke="#e2604f" stroke-width="1.5"/><path d="M 37 88 L 47 98 M 47 88 L 37 98" stroke="#e2604f" stroke-width="2.5" stroke-linecap="round"/><text x="66" y="98" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">London-implied brand, GBP checkout</text><circle cx="42" cy="135" r="12" fill="#0a1526" stroke="#e2604f" stroke-width="1.5"/><path d="M 37 130 L 47 140 M 47 130 L 37 140" stroke="#e2604f" stroke-width="2.5" stroke-linecap="round"/><text x="66" y="140" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">Address traces to a Delaware agent</text><circle cx="42" cy="177" r="12" fill="#0a1526" stroke="#e2604f" stroke-width="1.5"/><path d="M 37 172 L 47 182 M 47 172 L 37 182" stroke="#e2604f" stroke-width="2.5" stroke-linecap="round"/><text x="66" y="182" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">Six-week-old, WHOIS-masked domain</text><circle cx="42" cy="219" r="12" fill="#0a1526" stroke="#e2604f" stroke-width="1.5"/><path d="M 37 214 L 47 224 M 47 214 L 37 224" stroke="#e2604f" stroke-width="2.5" stroke-linecap="round"/><text x="66" y="224" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">Fast shipping over 15-25 day transit</text><circle cx="42" cy="261" r="12" fill="#0a1526" stroke="#e2604f" stroke-width="1.5"/><path d="M 37 256 L 47 266 M 47 256 L 37 266" stroke="#e2604f" stroke-width="2.5" stroke-linecap="round"/><text x="66" y="266" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">Terms hide a Guangdong warehouse</text></g><g transform="translate(624,158)"><rect width="520" height="360" rx="16" fill="#0e1c34" stroke="#38d39a" stroke-width="1.5"/><text x="30" y="52" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#38d39a">Disclosed store</text><circle cx="42" cy="93" r="12" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 36 93 L 41 98 L 49 87" fill="none" stroke="#38d39a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="98" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">Same name, stated legal entity link</text><circle cx="42" cy="135" r="12" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 36 135 L 41 140 L 49 129" fill="none" stroke="#38d39a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="140" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">Real operating address and phone</text><circle cx="42" cy="177" r="12" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 36 177 L 41 182 L 49 171" fill="none" stroke="#38d39a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="182" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">Ships-from origin on every page</text><circle cx="42" cy="219" r="12" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 36 219 L 41 224 L 49 213" fill="none" stroke="#38d39a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="224" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">Delivery: 15-25 business days shown</text><circle cx="42" cy="261" r="12" fill="#0a1526" stroke="#38d39a" stroke-width="1.5"/><path d="M 36 261 L 41 266 L 49 255" fill="none" stroke="#38d39a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="266" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#9fb2c9">Business verification complete</text></g></g></svg>