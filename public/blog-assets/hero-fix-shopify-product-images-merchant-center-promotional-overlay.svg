<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><title>Image Disapprovals — Clean Your Product Images hero banner</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="1" stop-color="#0d1a30"/></linearGradient>
<radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#41c6ee" stop-opacity="0.30"/><stop offset="1" stop-color="#41c6ee" stop-opacity="0"/></radialGradient>
<radialGradient id="glowRed" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ef6f6f" stop-opacity="0.22"/><stop offset="1" stop-color="#ef6f6f" stop-opacity="0"/></radialGradient>
<linearGradient id="photo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13294a"/><stop offset="1" stop-color="#0c1b32"/></linearGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="965" cy="300" r="320" fill="url(#glowCyan)"/>
<circle cx="1080" cy="150" r="220" fill="url(#glowRed)"/>
<g stroke="#25395a" stroke-width="1" opacity="0.35">
<line x1="0" y1="120" x2="1200" y2="120"/>
<line x1="0" y1="510" x2="1200" y2="510"/>
</g>
<g fill="#25395a" opacity="0.45">
<circle cx="80" cy="170" r="3"/><circle cx="130" cy="170" r="3"/><circle cx="180" cy="170" r="3"/>
<circle cx="80" cy="220" r="3"/><circle cx="130" cy="220" r="3"/><circle cx="180" cy="220" r="3"/>
<circle cx="80" cy="270" r="3"/><circle cx="130" cy="270" r="3"/><circle cx="180" cy="270" r="3"/>
</g>
<!-- Left text block -->
<text x="90" y="250" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#41c6ee">IMAGE DISAPPROVALS</text>
<text x="88" y="345" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="78" font-weight="800" fill="#e9f0fa">Clean Your</text>
<text x="88" y="430" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="78" font-weight="800" fill="#e9f0fa">Product Images</text>
<text x="92" y="485" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="500" fill="#9fb2c9">Overlays, watermarks &amp; the 500x500 rule</text>
<!-- Right icon: product image card with flagged overlay -->
<g transform="translate(770,165)">
<rect x="0" y="0" width="320" height="300" rx="18" fill="#0e1c34" stroke="#25395a" stroke-width="1.5"/>
<rect x="28" y="30" width="264" height="184" rx="12" fill="url(#photo)" stroke="#25395a" stroke-width="1.5"/>
<!-- product shape (a simple bottle/box silhouette) -->
<rect x="128" y="92" width="64" height="96" rx="10" fill="#1c3358" stroke="#41c6ee" stroke-width="2"/>
<rect x="146" y="70" width="28" height="26" rx="6" fill="#1c3358" stroke="#41c6ee" stroke-width="2"/>
<!-- promotional overlay strip -->
<rect x="40" y="44" width="120" height="34" rx="8" fill="#e89b3c" opacity="0.92"/>
<text x="100" y="67" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="800" fill="#0a1526">50% OFF</text>
<!-- watermark text -->
<text x="252" y="196" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#9fb2c9" opacity="0.55" transform="rotate(-18 252 196)">LOGO</text>
<!-- flagged badge -->
<g transform="translate(232,196)">
<circle cx="0" cy="0" r="34" fill="#0a1526" stroke="#ef6f6f" stroke-width="2.5"/>
<line x1="-13" y1="-13" x2="13" y2="13" stroke="#ef6f6f" stroke-width="4" stroke-linecap="round"/>
<line x1="13" y1="-13" x2="-13" y2="13" stroke="#ef6f6f" stroke-width="4" stroke-linecap="round"/>
</g>
<!-- footer label -->
<rect x="28" y="234" width="180" height="14" rx="7" fill="#1c3358"/>
<rect x="28" y="258" width="120" height="12" rx="6" fill="#16294a"/>
<text x="292" y="270" text-anchor="end" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#ef6f6f">DISAPPROVED</text>
</g>
</svg>
