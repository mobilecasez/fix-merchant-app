<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540"><title>Valid GTIN lengths: UPC-A 12, EAN/JAN 13, ISBN-13 13, ITF-14 14, UPC-E 8 digits</title>
<defs>
<linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="1" stop-color="#0d1a30"/></linearGradient>
</defs>
<rect width="1200" height="540" rx="18" fill="url(#bg3)" stroke="#25395a" stroke-width="1"/>
<text x="60" y="72" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30" font-weight="800" fill="#e9f0fa">A valid GTIN is 8, 12, 13, or 14 digits</text>
<text x="60" y="104" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#9fb2c9">Spaces and dashes are ignored &#8212; digit count and correctness are what matter.</text>
<!-- Header row -->
<g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#6b819c">
<text x="80" y="152">FORMAT</text>
<text x="330" y="152">DIGITS</text>
<text x="500" y="152">TYPICAL USE</text>
</g>
<line x1="60" y1="168" x2="1140" y2="168" stroke="#25395a" stroke-width="1"/>
<!-- Rows -->
<g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<!-- UPC-A -->
<rect x="60" y="180" width="1080" height="58" rx="10" fill="#0e1c34"/>
<text x="80" y="216" font-size="22" font-weight="700" fill="#e9f0fa">UPC-A</text>
<rect x="310" y="192" width="86" height="36" rx="9" fill="#0a1526" stroke="#41c6ee" stroke-width="1.3"/><text x="353" y="217" text-anchor="middle" font-size="20" font-weight="800" fill="#41c6ee">12</text>
<text x="500" y="216" font-size="18" fill="#9fb2c9">Most common in North America</text>
<!-- EAN/JAN -->
<rect x="60" y="244" width="1080" height="58" rx="10" fill="#0a1526"/>
<text x="80" y="280" font-size="22" font-weight="700" fill="#e9f0fa">EAN / JAN</text>
<rect x="310" y="256" width="86" height="36" rx="9" fill="#0e1c34" stroke="#41c6ee" stroke-width="1.3"/><text x="353" y="281" text-anchor="middle" font-size="20" font-weight="800" fill="#41c6ee">13</text>
<text x="500" y="280" font-size="18" fill="#9fb2c9">Most common internationally</text>
<!-- ISBN-13 -->
<rect x="60" y="308" width="1080" height="58" rx="10" fill="#0e1c34"/>
<text x="80" y="344" font-size="22" font-weight="700" fill="#e9f0fa">ISBN-13</text>
<rect x="310" y="320" width="86" height="36" rx="9" fill="#0a1526" stroke="#41c6ee" stroke-width="1.3"/><text x="353" y="345" text-anchor="middle" font-size="20" font-weight="800" fill="#41c6ee">13</text>
<text x="500" y="344" font-size="18" fill="#9fb2c9">Used as the GTIN for books</text>
<!-- ITF-14 -->
<rect x="60" y="372" width="1080" height="58" rx="10" fill="#0a1526"/>
<text x="80" y="408" font-size="22" font-weight="700" fill="#e9f0fa">ITF-14</text>
<rect x="310" y="384" width="86" height="36" rx="9" fill="#0e1c34" stroke="#41c6ee" stroke-width="1.3"/><text x="353" y="409" text-anchor="middle" font-size="20" font-weight="800" fill="#41c6ee">14</text>
<text x="500" y="408" font-size="18" fill="#9fb2c9">Multipacks / cases</text>
<!-- UPC-E -->
<rect x="60" y="436" width="1080" height="58" rx="10" fill="#0e1c34"/>
<text x="80" y="472" font-size="22" font-weight="700" fill="#e9f0fa">UPC-E</text>
<rect x="310" y="448" width="86" height="36" rx="9" fill="#0a1526" stroke="#41c6ee" stroke-width="1.3"/><text x="353" y="473" text-anchor="middle" font-size="20" font-weight="800" fill="#41c6ee">8</text>
<text x="500" y="472" font-size="18" fill="#9fb2c9">Compressed UPC</text>
</g>
</svg>
