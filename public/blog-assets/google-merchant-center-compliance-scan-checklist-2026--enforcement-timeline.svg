<text x="56" y="66" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="600" fill="#41c6ee" letter-spacing="3">HOW ENFORCEMENT ESCALATES</text>
<text x="56" y="108" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800" fill="#e9f0fa">From warning to reinstatement</text><line x1="120" y1="250" x2="1080" y2="250" stroke="#25395a" stroke-width="2"/><g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><circle cx="120.0" cy="250" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="2"/><circle cx="120.0" cy="250" r="5" fill="#38d39a"/><text x="120.0" y="210" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="800" fill="#e9f0fa" text-anchor="middle">Warning email</text><text x="120.0" y="296" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#9fb2c9" text-anchor="middle">Policy flagged</text><text x="120.0" y="318" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#9fb2c9" text-anchor="middle">Account still live</text><circle cx="440.0" cy="250" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="2"/><circle cx="440.0" cy="250" r="5" fill="#38d39a"/><text x="440.0" y="210" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="800" fill="#e9f0fa" text-anchor="middle">7–28 day window</text><text x="440.0" y="296" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#9fb2c9" text-anchor="middle">Countdown to fix</text><text x="440.0" y="318" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#9fb2c9" text-anchor="middle">Best chance you get</text><circle cx="760.0" cy="250" r="16" fill="#0a1526" stroke="#38d39a" stroke-width="2"/><circle cx="760.0" cy="250" r="5" fill="#38d39a"/><text x="760.0" y="210" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="800" fill="#e9f0fa" text-anchor="middle">Suspension</text><text x="760.0" y="296" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#9fb2c9" text-anchor="middle">All Shopping halts</text><text x="760.0" y="318" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#9fb2c9" text-anchor="middle">Site-wide review</text><circle cx="1080.0" cy="250" r="16" fill="#0a1526" stroke="#41c6ee" stroke-width="2"/><circle cx="1080.0" cy="250" r="5" fill="#41c6ee"/><text x="1080.0" y="210" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="800" fill="#e9f0fa" text-anchor="middle">Re-review</text><text x="1080.0" y="296" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#9fb2c9" text-anchor="middle">3–7 business days</text><text x="1080.0" y="318" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#9fb2c9" text-anchor="middle">Fix first, then appeal</text></g></svg>