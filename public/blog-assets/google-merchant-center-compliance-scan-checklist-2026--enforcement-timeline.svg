<radialGradient id="glenforcem" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#38d39a" stop-opacity="0.16"/><stop offset="1" stop-color="#38d39a" stop-opacity="0"/></radialGradient>
</defs>
